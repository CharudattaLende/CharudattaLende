<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset="0.6" stop-color="#1a0b3b"/>
      <stop offset="1" stop-color="#4a1260"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe45e"/>
      <stop offset="0.55" stop-color="#ff7ac6"/>
      <stop offset="1" stop-color="#a45cff"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0b4d"/>
      <stop offset="1" stop-color="#07030f"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="floorClip"><rect x="0" y="170" width="900" height="130"/></clipPath>
  </defs>

  <rect width="900" height="300" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle cx="60" cy="40" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="90" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="30" r="1.2"><animate attributeName="opacity" values="1;0.1;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="35" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="95" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="50" r="1.3"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="140" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="150" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- sun, sinking behind horizon -->
  <circle cx="450" cy="170" r="62" fill="url(#sun)" filter="url(#glow)">
    <animate attributeName="cy" values="170;176;170" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- floor -->
  <rect x="0" y="170" width="900" height="130" fill="url(#floor)"/>
  <line x1="0" y1="170" x2="900" y2="170" stroke="#ff7ac6" stroke-width="2" filter="url(#glow)"/>

  <g clip-path="url(#floorClip)" stroke="#c77dff" stroke-width="1.2" opacity="0.9">
    <!-- converging vertical lines -->
    <g stroke-opacity="0.8">
      <line x1="450" y1="170" x2="-450" y2="300"/>
      <line x1="450" y1="170" x2="-350" y2="300"/>
      <line x1="450" y1="170" x2="-250" y2="300"/>
      <line x1="450" y1="170" x2="-150" y2="300"/>
      <line x1="450" y1="170" x2="-50" y2="300"/>
      <line x1="450" y1="170" x2="50" y2="300"/>
      <line x1="450" y1="170" x2="150" y2="300"/>
      <line x1="450" y1="170" x2="250" y2="300"/>
      <line x1="450" y1="170" x2="350" y2="300"/>
      <line x1="450" y1="170" x2="450" y2="300"/>
      <line x1="450" y1="170" x2="550" y2="300"/>
      <line x1="450" y1="170" x2="650" y2="300"/>
      <line x1="450" y1="170" x2="750" y2="300"/>
      <line x1="450" y1="170" x2="850" y2="300"/>
      <line x1="450" y1="170" x2="950" y2="300"/>
      <line x1="450" y1="170" x2="1050" y2="300"/>
      <line x1="450" y1="170" x2="1150" y2="300"/>
      <line x1="450" y1="170" x2="1250" y2="300"/>
      <line x1="450" y1="170" x2="1350" y2="300"/>
    </g>
    <!-- horizontal lines rushing toward the viewer -->
    <line x1="0" x2="900" y1="170" y2="170"><animate attributeName="y1" values="170;173.6" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y2" values="170;173.6" dur="1.2s" repeatCount="indefinite"/></line>
    <line x1="0" x2="900" y1="173.6" y2="173.6"><animate attributeName="y1" values="173.6;184.4" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y2" values="173.6;184.4" dur="1.2s" repeatCount="indefinite"/></line>
    <line x1="0" x2="900" y1="184.4" y2="184.4"><animate attributeName="y1" values="184.4;202.5" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y2" values="184.4;202.5" dur="1.2s" repeatCount="indefinite"/></line>
    <line x1="0" x2="900" y1="202.5" y2="202.5"><animate attributeName="y1" values="202.5;227.8" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y2" values="202.5;227.8" dur="1.2s" repeatCount="indefinite"/></line>
    <line x1="0" x2="900" y1="227.8" y2="227.8"><animate attributeName="y1" values="227.8;260.3" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y2" values="227.8;260.3" dur="1.2s" repeatCount="indefinite"/></line>
    <line x1="0" x2="900" y1="260.3" y2="260.3"><animate attributeName="y1" values="260.3;300" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y2" values="260.3;300" dur="1.2s" repeatCount="indefinite"/></line>
    <line x1="0" x2="900" y1="300" y2="300"><animate attributeName="y1" values="300;346.9" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y2" values="300;346.9" dur="1.2s" repeatCount="indefinite"/></line>
  </g>

  <!-- title -->
  <g font-family="'Courier New', Consolas, monospace" text-anchor="middle" font-weight="bold">
    <text x="454" y="82" font-size="50" fill="#00e5ff" opacity="0.7">CHARUDATTA
      <animate attributeName="x" values="454;451;456;454" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="446" y="78" font-size="50" fill="#ff2e93" opacity="0.7">CHARUDATTA
      <animate attributeName="x" values="446;449;444;446" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="80" font-size="50" fill="#ffffff" filter="url(#glow)">CHARUDATTA</text>
    <text x="450" y="106" font-size="14" fill="#9ecbff" letter-spacing="3" font-weight="normal">CSE (IoT)  •  FULL-STACK  •  AI/ML  •  DSA GRINDER</text>

    <rect x="330" y="232" width="240" height="34" rx="4" fill="#07030f" fill-opacity="0.85" stroke="#ffe45e" stroke-width="1.5"/>
    <text x="450" y="255" font-size="18" fill="#ffe45e" letter-spacing="4">PRESS START ▶
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;0.75;0.75" dur="1.4s" repeatCount="indefinite" calcMode="discrete"/>
    </text>
  </g>
</svg>
