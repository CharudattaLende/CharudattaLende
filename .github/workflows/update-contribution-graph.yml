name: Update contribution line graph

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-contribution-graph.yml"
      - "scripts/generate_contribution_graph.py"
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate SVG from GitHub contribution data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_contribution_graph.py

      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-graph.svg
          if git diff --cached --quiet; then
            echo "Contribution graph is already up to date."
            exit 0
          fi
          git commit -m "Update live GitHub contribution graph"
          git pull --rebase origin main
          git push
